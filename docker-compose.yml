services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bluba_anticipa
      POSTGRES_USER: bluba
      POSTGRES_PASSWORD: bluba
    ports:
      - "5432:5432"
    volumes:
      - bluba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluba -d bluba_anticipa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bluba_postgres_data:
