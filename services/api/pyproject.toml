[project]
name = "bluba-api"
version = "0.1.0"
description = "FastAPI service for Bluba Anticipa MVP bootstrap."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openapi-spec-validator>=0.7",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "SQLAlchemy>=2.0",
  "uvicorn[standard]>=0.30",
  "bluba-predictor==0.1.0"
]

[tool.pytest.ini_options]
pythonpath = ["src", "../predictor/src"]
